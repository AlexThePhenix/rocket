<!DOCTYPE html>
<html>
    <head>
        <title>Rocket go noom</title>
    </head>
    <body>
        <img src="./rocket2.png" class = "rocket">
        <script>
            const rocket = document.querySelector(".rocket");

            const acceleration = 1000;
            const maximumSpeed = 500;
            const offset = 45 * Math.PI / 180;

           // rocket position
            let x = 0;
            let y = 0;
            // rocket velocity
            let vy = 0;
            let vx = 0;
            // rocket rotaion
            let a = 0;

            let mx = 0;
            let my = 0;

            document.onmousemove = function (e){
                mx = e.clientX;
                my = e.clientY;

                
            }
            function update(t, dt){
                let dy = my - y;
                let dx = mx - x;
                if (dx !== 0 || dy !== 0)
                a = Math.atan2(dy,dx)
                let m = Math.hypot(dx,dy)
                if (m !== 0){
                    //normalize direction
                    dx /= m;
                    dy /= m;
                    // update rocket velocity
                    vx += acceleration * dx * dt;
                    vy += acceleration * dy * dt;
                    //clamp velocity
                    m = Math.hypot(vx,vy);
                    if (m > maximumSpeed){
                        let a = Math.atan2(vy,vx);
                        vx *= maximumSpeed / m;
                        vy *= maximumSpeed / m;
                    }
                }
                //updat position
                    x += vx * dt;
                    y += vy * dt;

                 rocket.style.transform = `translate(${x}px, ${y}px) rotate(${a}rad)`;

            } 
            function animate(t0, t1, t2){
                let  t = (t2 - t0) / 1000;
                let dt = (t2 - t1) / 1000;

                update(t, dt);

                requestAnimationFrame(t3 => animate(t0, t2, t3));
            }
            requestAnimationFrame(
                t0 => requestAnimationFrame(
                    t1 => requestAnimationFrame(
                        t2 => animate(t0,t1,t2))))
        
        </script>
    </body>
    <style>
        .rocket{
            width: 100px;
            position: absolute;
            transform-origin: center;
        }
        body{
            background-image: url("./purple\ hole.jpg ");
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }
    </style>
</html>
